<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kit 72 h</title>
<meta name="theme-color" content="#E9EEEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit 72 h">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#E9EEEC; --surface:#F7F9F8; --ink:#12222E; --muted:#51636E; --line:#C5D0CE;
  --accent:#1F5F8B; --on-accent:#FFFFFF;
  --ok:#2E7D5B; --on-ok:#FFFFFF; --warn:#9A6400; --on-warn:#FFFFFF; --bad:#B3382C; --on-bad:#FFFFFF; --exp:#4B5963; --on-exp:#FFFFFF;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1A22; --surface:#17252F; --ink:#E6EEF0; --muted:#97A9B2; --line:#2B3E4A;
    --accent:#6DB3E0; --on-accent:#08202F;
    --ok:#5BC08F; --on-ok:#06261A; --warn:#E3A93A; --on-warn:#2B1C00; --bad:#EE7A6C; --on-bad:#2E0A05; --exp:#8A99A3; --on-exp:#0F1A22;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabecera */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 0 10px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font:600 25px/1.1 var(--serif);letter-spacing:-.01em}
#sub{margin:3px 0 0;font-size:13px;color:var(--muted)}
.iconbtn{flex:none;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600}

/* contenido */
main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.gauge{padding:18px 0 14px;border-bottom:1px solid var(--line)}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.g-name{font-weight:600;font-size:15px}
.g-num{font:600 46px/1 var(--serif);letter-spacing:-.02em}
.g-num small{font:500 15px var(--sans);letter-spacing:0;color:var(--muted)}
.ruler{position:relative;height:12px;margin:16px 0 26px;background:var(--line);border-radius:2px}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ok)}
.ruler .fill.warn{background:var(--warn)} .ruler .fill.bad{background:var(--bad)}
.ruler .tick{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--muted)}
.ruler .tick.t3{width:3px;margin-left:-1px;background:var(--ink)}
.ruler .tl{position:absolute;top:19px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.ruler .tl.t3{color:var(--ink);font-weight:700}
.g-note{margin:0;font-size:14px;color:var(--muted)}
.cells{display:flex;gap:4px;margin:16px 0 12px}
.cells i{flex:1;height:14px;border-radius:2px;background:var(--line)}
.cells i.on{background:var(--accent)}
.lines{margin:0 0 4px;padding:0 0 14px;list-style:none;border-bottom:1px solid var(--line)}
.lines li{margin:3px 0;font-size:14px;color:var(--muted)}

.alert{margin:18px 0 4px;padding:12px 14px;background:var(--surface);border-left:5px solid var(--warn)}
.alert h2{margin:0 0 6px;font:600 15px var(--sans)}
.alert ul{margin:0;padding:0;list-style:none}
.alert li{margin:3px 0;font-size:14px}

.weak{margin:16px 0 0;padding:0 0 16px;border-bottom:1px solid var(--line)}
.weak .w-line{margin:0 0 10px;font-size:15px}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.w-grid div{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.w-grid span{display:block;font-size:13px;color:var(--muted)}
.w-grid strong{font:600 22px/1.2 var(--serif)}
.w-grid .w-min{border:2px solid var(--warn);padding:7px 9px}
.weak .hint{margin-top:10px}
.rev{margin:16px 0 0;padding:12px 14px;background:var(--surface);border-left:5px solid var(--accent)}
.rev h2{margin:0 0 4px;font:600 15px var(--sans)}
.rev p{margin:0 0 10px;font-size:14px}
.search input{margin-top:0}
.search{margin:8px 0 2px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 4px}
.sec-head h2{margin:0;font:600 20px var(--serif)}
.btn{min-height:44px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.empty{margin:14px 0;padding:14px;border:1px dashed var(--line);color:var(--muted);font-size:15px}

.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 0;text-align:left;background:none;border:0;cursor:pointer}
.r-main{flex:1;min-width:0}
.r-main strong{display:block;font-weight:600;overflow-wrap:anywhere}
.r-sub{display:block;margin-top:1px;font-size:14px;color:var(--muted)}
.r-sub.pending{font-style:italic}
.r-chip{display:block;margin-top:6px}
.chip{flex:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok);color:var(--on-ok);border-color:transparent}
.chip.warn{background:var(--warn);color:var(--on-warn);border-color:transparent}
.chip.bad{background:var(--bad);color:var(--on-bad);border-color:transparent}
.price{flex:none;font-size:13px;color:var(--muted)}
.chk{flex:none;display:grid;place-items:center;width:44px;height:44px;cursor:pointer}
.chk input{width:26px;height:26px;margin:0;accent-color:var(--accent);cursor:pointer}

.stock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 0}
.stock .s-name{display:block;margin-bottom:4px;font-size:14px;font-weight:600}
.step{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.step button{flex:none;width:38px;min-height:44px;border:0;background:none;font-size:20px;cursor:pointer}
.step input{flex:1;min-width:0;width:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:none;text-align:center;font-size:17px;font-weight:600;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{position:relative;flex:1;min-width:0;min-height:58px;padding:10px 2px;background:none;border:0;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.badge{position:absolute;top:5px;right:6px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:var(--on-bad);font-size:11px;line-height:17px;font-weight:700}
.badge[hidden]{display:none}

/* diálogos */
dialog{width:100%;max-width:640px;max-height:92vh;margin:auto auto 0;padding:0;border:0;border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.pad{padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.pad h2{margin:0 0 6px;font:600 22px var(--serif)}
.pad h3{margin:24px 0 4px;font:600 16px var(--sans)}
.fld{display:block;margin:14px 0 0;font-size:14px;font-weight:600}
.fld input,.fld select,.fld textarea{display:block;width:100%;min-height:46px;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px;font-weight:400}
.fld textarea{min-height:90px;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.seg label{position:relative;flex:1}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:11px;text-align:center;font-weight:600}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:-4px}
.calc{margin-top:10px;font-size:14px}
.calc summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px}
.calc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkline{display:flex;align-items:center;gap:12px;margin-top:18px;font-weight:600}
.checkline input{width:26px;height:26px;accent-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.actions .grow{flex:1}
.stack{display:grid;gap:10px;margin-top:10px}
[hidden]{display:none!important}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;max-width:90%;padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;text-align:center}
.hbtns{flex:none;display:flex;gap:8px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* modo apagón: negro puro, letra grande, sin adornos */
html.apagon{color-scheme:dark;
  --bg:#000000;--surface:#000000;--ink:#EDEDED;--muted:#B3B3B3;--line:#444444;
  --accent:#F2B84B;--on-accent:#000000;--ok:#8FD19E;--on-ok:#000000;--warn:#F2B84B;--on-warn:#000000;--bad:#FF8A7A;--on-bad:#000000;--exp:#8A8A8A;--on-exp:#000000}
html.apagon body{font-size:19px}
html.apagon h1{font-size:24px;white-space:nowrap}
html.apagon #sub{display:none}
html.apagon .iconbtn{padding:0 10px}
html.apagon .alert{border-left-color:var(--warn)}
html.apagon .rev{border-left-color:var(--accent)}
html.apagon .r-sub,html.apagon .g-note,html.apagon .lines li,html.apagon .alert li,html.apagon .rev p,html.apagon .stock .s-name,html.apagon .weak .w-line{font-size:17px}
html.apagon .hint,html.apagon .weak .hint{display:none}
html.apagon .g-num{font-size:54px}
html.apagon .ruler .tl,html.apagon .chip,html.apagon .price,html.apagon .w-grid span{font-size:15px}
html.apagon .btn,html.apagon .iconbtn{font-size:18px}
html.apagon .nav button{font-size:14px}
html.apagon .row{min-height:68px}
html.apagon .alert,html.apagon .rev{border:1px solid var(--line);border-left-width:6px}
html.apagon .w-grid div,html.apagon .step,html.apagon dialog{border:1px solid var(--line)}
html.apagon .w-grid .w-min{border:2px solid var(--warn)}
html.apagon .top{border-bottom-color:var(--line)}
@media (prefers-reduced-motion:no-preference){ .ruler .fill{transition:width .35s ease} }

/* v2: colores de caducidad, cantidades, filtros, sitios */
.chip.exp{background:var(--exp);color:var(--on-exp);border-color:transparent}
.list>li.c-ok{box-shadow:inset 4px 0 0 var(--ok);padding-left:12px}
.list>li.c-warn{box-shadow:inset 4px 0 0 var(--warn);padding-left:12px}
.list>li.c-bad{box-shadow:inset 4px 0 0 var(--bad);padding-left:12px}
.list>li.c-exp{box-shadow:inset 4px 0 0 var(--exp);padding-left:12px}
.cells i.part{background:var(--accent);opacity:.45}
.qty{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.qty button{width:34px;min-height:44px;padding:0;border:0;background:none;font-size:20px;cursor:pointer}
.qty span{min-width:36px;text-align:center;font-weight:600;font-size:14px}
.flt{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.flt button{flex:1;min-height:44px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted)}
.flt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.buy{margin:6px 0 4px;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.buy p{margin:0 0 8px;font-size:14px}
.buy p:last-child{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list>li.site{display:block;padding:0 0 12px}
.list>li.site .row{width:100%}
.sact{display:flex;gap:10px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;text-align:center}
.sact a.btn{flex:1}
.guardia .stack a.btn,.guardia .stack button{width:100%}
.guardia{margin-bottom:6px}
.tramo{margin:12px 0 0;padding:10px 12px 12px;border:1px solid var(--line);border-radius:9px}
.tramo legend{padding:0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.dias{display:flex;gap:4px;flex-wrap:wrap}
.dias label{position:relative}
.dias input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.dias span{display:block;min-width:38px;padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:14px}
.dias input:checked+span{background:var(--ink);color:var(--bg)}
.dias input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.hrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast button{margin-left:12px;padding:4px 10px;min-height:32px;border:1px solid currentColor;border-radius:8px;background:transparent;font-weight:700;cursor:pointer}

/* pantalla de bienvenida */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;background:#121212;color:#EDE6D6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);cursor:pointer;transition:opacity .35s ease,visibility .35s}
#intro.out{opacity:0;visibility:hidden}
.in-hz{flex:none;height:26px;background:repeating-linear-gradient(-45deg,#F2B84B 0 18px,#121212 18px 36px)}
.in-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;max-width:440px;width:100%;margin:0 auto;padding:18px 24px;text-align:center}
.in-kicker{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F2B84B}
.in-can{width:132px;height:132px}
.in-title{margin:0;font:700 40px/1.05 var(--serif);letter-spacing:-.01em}
.in-line{margin:0;font-size:18px;line-height:1.4}
.in-status{margin:0;padding:10px 14px;border-left:4px solid #D9473A;background:#1C1C1C;font-size:15px;text-align:left;width:100%}
.in-stamp{display:inline-block;transform:rotate(-4deg);border:3px solid #D9473A;color:#D9473A;padding:3px 12px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.in-btn{min-height:58px;padding:0 30px;border:0;border-radius:12px;background:#F2B84B;color:#121212;font-size:20px;font-weight:800;cursor:pointer}
.in-foot{margin:0;font-size:13px;color:#A8A294}
.in-btn:focus-visible{outline:3px solid #EDE6D6;outline-offset:4px}
@media (prefers-reduced-motion:no-preference){
  @keyframes in-flick{0%,18%,22%,60%,64%,100%{opacity:1}20%,62%{opacity:.3}}
  @keyframes in-pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,184,75,.55)}60%{box-shadow:0 0 0 14px rgba(242,184,75,0)}}
  .in-title span{animation:in-flick 7s infinite}
  .in-btn{animation:in-pulse 2.2s infinite}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>Kit de 72 horas</h1>
      <p id="sub"></p>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="btnApagon" data-act="apagon" aria-pressed="false" aria-label="Modo apagón: negro y letra grande">Apagón</button>
      <button class="iconbtn" data-act="settings" aria-label="Ajustes y copia de seguridad">Ajustes</button>
    </div>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1"></main>
<noscript><p class="wrap">Esta aplicación necesita JavaScript.</p></noscript>

<nav class="nav" aria-label="Secciones">
  <button data-act="tab" data-tab="comida" id="nav-comida">Comida<span class="badge" id="badge-comida" hidden></span></button>
  <button data-act="tab" data-tab="aparatos" id="nav-aparatos">Aparatos</button>
  <button data-act="tab" data-tab="higiene" id="nav-higiene">Higiene<span class="badge" id="badge-higiene" hidden></span></button>
  <button data-act="tab" data-tab="medicinas" id="nav-medicinas">Medicinas<span class="badge" id="badge-medicinas" hidden></span></button>
  <button data-act="tab" data-tab="sitios" id="nav-sitios">Sitios</button>
</nav>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="intro" role="dialog" aria-modal="true" aria-labelledby="introT" hidden>
  <div class="in-hz" aria-hidden="true"></div>
  <div class="in-body">
    <p class="in-kicker">Departamento de Apocalipsis Doméstico</p>
    <svg class="in-can" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse cx="60" cy="108" rx="40" ry="6" fill="#000" opacity=".5"/>
      <ellipse cx="60" cy="96" rx="32" ry="9" fill="#8F99A3"/>
      <rect x="28" y="34" width="64" height="62" fill="#AEB7BF"/>
      <rect x="28" y="52" width="64" height="32" fill="#2F6FA6"/>
      <ellipse cx="60" cy="34" rx="32" ry="9" fill="#D5DADF"/>
      <circle cx="90" cy="31" r="7" fill="#121212"/><circle cx="82" cy="27" r="5" fill="#121212"/>
      <circle cx="50" cy="66" r="7" fill="#fff"/><circle cx="70" cy="66" r="7" fill="#fff"/>
      <circle cx="52" cy="67" r="3" fill="#121212"/><circle cx="72" cy="67" r="3" fill="#121212"/>
      <path d="M52 78 q4 -4 8 0 t8 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p class="in-title" id="introT"><span>Kit de</span> 72 horas</p>
    <p class="in-line" id="introLine"></p>
    <p class="in-status" id="introStatus"></p>
    <span class="in-stamp">Solo para supervivientes</span>
    <button type="button" class="in-btn" id="introBtn">Entrar al búnker</button>
    <p class="in-foot">Toca para entrar. Los zombis no saben tocar pantallas.</p>
  </div>
  <div class="in-hz" aria-hidden="true"></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(()=>{
'use strict';

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=0)=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:d,minimumFractionDigits:0,useGrouping:'always'});
const eur=n=>Number(n).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const pl=(n,a,b)=>n===1?a:b;
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0;};
const numOrNull=v=>{const t=String(v??'').trim();if(!t)return null;const n=parseFloat(t.replace(',','.'));return Number.isFinite(n)?n:null;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const ymd=x=>`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}${String(x.getDate()).padStart(2,'0')}`;
const isoHoy=()=>{const t=today();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;};
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const daysLeft=s=>{const d=parseD(s);return d?Math.round((d-today())/86400000):null;};
const monthYear=s=>{const d=parseD(s);return d?d.toLocaleDateString('es-ES',{month:'short',year:'numeric'}):'';};
const longDate=s=>{const d=parseD(s);return d?d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'';};
const plano=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const TABS=['comida','aparatos','higiene','medicinas','sitios'];
const KINDS={comida:'comida',aparato:'aparatos',higiene:'higiene',medicina:'medicinas',sitio:'sitios'};

/* ---------- datos ---------- */
const KEY='kit72.v1';
const DEFAULTS=()=>({v:2,tab:'comida',apagon:false,creado:isoHoy(),ultimaRevision:'',ultimaCopia:'',avisosBg:false,
  settings:{adultos:2,ninos:2,kcalAdulto:2000,kcalNino:1600,litrosDia:3,movilMah:4500,eficiencia:70,
    avisoDias:14,naranjaDias:30,minCocinaDia:30,cargasMovilDia:1,revisionDias:90,copiaDias:60,guardiaUrl:'',intro:true},
  comida:[],aparatos:[],higiene:[],medicinas:[],sitios:[],stock:{AA:0,AAA:0,gas:0}});
let storageOk=true;
function load(){
  const d=DEFAULTS();
  try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw),d);}
  catch(e){storageOk=false;}
  return d;
}
function normalize(p,d){
  d=d||DEFAULTS();
  if(!p||typeof p!=='object')return d;
  const ps=p.settings||{},s=d.settings;
  for(const k of Object.keys(s)){if(ps[k]!==undefined&&ps[k]!==null&&typeof ps[k]===typeof s[k])s[k]=ps[k];}
  if(typeof ps.kcalDia==='number'&&ps.kcalAdulto===undefined)s.kcalAdulto=ps.kcalDia;
  if(p.v!==2&&ps.avisoDias===7)s.avisoDias=14;
  Object.assign(d.stock,p.stock||{});
  const arr=k=>Array.isArray(p[k])?p[k]:[];
  d.comida=arr('comida');d.higiene=arr('higiene');d.medicinas=arr('medicinas');d.sitios=arr('sitios');
  d.aparatos=arr('aparatos').map(a=>{
    if(typeof a.tengo==='boolean')a.tengo=a.tengo?(a.cantidad||1):0;
    if(!(a.tengo>=0))a.tengo=0;
    return a;
  });
  if(typeof p.creado==='string'&&p.creado)d.creado=p.creado;
  if(typeof p.ultimaRevision==='string')d.ultimaRevision=p.ultimaRevision;
  if(typeof p.ultimaCopia==='string')d.ultimaCopia=p.ultimaCopia;
  if(typeof p.avisosBg==='boolean')d.avisosBg=p.avisosBg;
  if(TABS.includes(p.tab))d.tab=p.tab;
  if(typeof p.apagon==='boolean')d.apagon=p.apagon;
  return d;
}
let state=load();
const filtro={aparatos:'todo',higiene:'todo'};
const q={comida:'',aparatos:'',higiene:'',medicinas:'',sitios:''};
const npers=()=>state.settings.adultos+state.settings.ninos;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){storageOk=false;toast('No se pudo guardar en este navegador. Haz una copia desde Ajustes.');}
  syncAlertas();
}

/* ---------- cálculos ---------- */
function calcComida(){
  const s=state.settings;let kcal=0,litros=0,sinDato=0,caducados=0;
  for(const it of state.comida){
    const d=daysLeft(it.caduca);
    if(d!==null&&d<0){caducados++;continue;}
    if(it.tipo==='agua'){if(it.litrosUd>0)litros+=it.cantidad*it.litrosUd;else sinDato++;}
    else{if(it.kcalUd>0)kcal+=it.cantidad*it.kcalUd;else sinDato++;}
  }
  const needK=(s.adultos*s.kcalAdulto+s.ninos*s.kcalNino)||1,needL=(npers()*s.litrosDia)||1;
  return {kcal,litros,sinDato,caducados,diasComida:kcal/needK,diasAgua:litros/needL,
    faltaKcal:3*needK-kcal,faltaL:3*needL-litros};
}
const itemsConFecha=src=>{
  const out=[];
  if(!src||src==='comida')state.comida.forEach(it=>out.push({it,src:'comida'}));
  if(!src||src==='higiene')state.higiene.filter(it=>it.tengo>0).forEach(it=>out.push({it,src:'higiene'}));
  if(!src||src==='medicinas')state.medicinas.filter(it=>it.cantidad>0).forEach(it=>out.push({it,src:'medicinas'}));
  return out;
};
function alertas(src){
  const lim=state.settings.avisoDias;
  return itemsConFecha(src).map(x=>({...x,d:daysLeft(x.it.caduca)}))
    .filter(x=>x.d!==null&&x.d<=lim).sort((a,b)=>a.d-b.d);
}
const filtrar=(arr,tab)=>{const t=plano(q[tab]).trim();return t?arr.filter(x=>plano(x.nombre).includes(t)):arr;};
const diasDesde=ref=>Math.round((today()-(parseD(ref)||today()))/86400000);
function powerbanks(){
  const s=state.settings;let mah=0;
  for(const a of state.aparatos){if(a.tengo>0&&a.energia==='powerbank'&&a.mah>0)mah+=a.tengo*a.mah*s.eficiencia/100;}
  return {mah,cargas:mah/(s.movilMah||1)};
}
const aFalta=a=>Math.max(0,(a.cantidad||0)-(a.tengo||0));
const hTengo=it=>{const d=daysLeft(it.caduca);return(d!==null&&d<0)?0:(it.tengo||0);};
const hNeed=it=>it.uso>0?Math.ceil(3*npers()*it.uso):(it.objetivo>0?it.objetivo:0);
const hFalta=it=>Math.max(0,hNeed(it)-hTengo(it));
const hDias=it=>it.uso>0?hTengo(it)/(npers()*it.uso):null;
function aparatoInfo(a){
  const s=state.settings,t=a.tengo||0;
  if(!(t>0))return {t:'Pendiente de comprar',pending:true};
  switch(a.energia){
    case 'pilas':{
      const st=state.stock[a.tipoPila]||0,per=a.pilasPorAparato||0;
      if(!per)return {t:'Falta indicar cuántas pilas usa'};
      const juegos=Math.floor(st/per);
      if(!a.horasJuego)return {t:`Falta el dato de horas por juego. Con tus pilas salen ${juegos} ${pl(juegos,'juego','juegos')} de ${per} ${a.tipoPila}`};
      return {t:`${nf(juegos*a.horasJuego,1)} h de uso con tus ${st} pilas ${a.tipoPila} (${juegos} ${pl(juegos,'juego','juegos')}), si son solo para un aparato`};
    }
    case 'bateria':{
      if(!a.horasBateria)return {t:'Falta el dato de horas con la batería llena'};
      let x=`${nf(a.horasBateria,1)} h con la batería llena`;
      const pb=powerbanks();
      if(a.mah>0&&pb.mah>0){
        const rec=Math.floor(pb.mah/a.mah);
        if(rec>0)x+=`. Con las powerbanks, unas ${rec} ${pl(rec,'recarga','recargas')} más (${nf(a.horasBateria*(1+rec),1)} h) si les dedicas toda su carga`;
      }
      return {t:x};
    }
    case 'powerbank':{
      if(!(a.mah>0))return {t:'Falta la capacidad en mAh'};
      const c=t*a.mah*s.eficiencia/100/(s.movilMah||1);
      return {t:`Unas ${nf(c,1)} cargas de móvil (${t} × ${nf(a.mah)} mAh al ${s.eficiencia} %)`};
    }
    case 'gas':{
      const st=state.stock.gas||0;
      if(!(a.minGas>0))return {t:'Falta cuántos minutos de llama da un cartucho'};
      return {t:`${nf(st*a.minGas)} min de llama con tus ${st} ${pl(st,'cartucho','cartuchos')}`};
    }
    default:return {t:'Sin cálculo de autonomía'};
  }
}
function estadoSitio(s,now=new Date()){
  const mins=h=>{const m=/^(\d{1,2}):(\d{2})$/.exec(h||'');return m?(+m[1])*60+(+m[2]):null;};
  const tr=(s.horario||[]).filter(t=>t.dias&&t.dias.length&&mins(t.de)!==null&&mins(t.a)!==null);
  if(!tr.length)return {k:'none',t:'Sin horario'};
  const dow=now.getDay(),m=now.getHours()*60+now.getMinutes();
  let cierra=null;
  for(const t of tr){
    const de=mins(t.de),a=mins(t.a);
    for(const d of t.dias){
      if(a===de){if(d===dow)cierra='24h';}
      else if(a>de){if(d===dow&&m>=de&&m<a)cierra=t.a;}
      else{if(d===dow&&m>=de)cierra=t.a;if(d===(dow+6)%7&&m<a)cierra=t.a;}
    }
  }
  if(cierra)return {k:'open',t:cierra==='24h'?'Abierto según tu horario, las 24 horas':`Abierto según tu horario, cierra a las ${cierra}`};
  for(let k=0;k<=7;k++){
    const day=(dow+k)%7;let best=null;
    for(const t of tr){
      if(!t.dias.includes(day))continue;
      const de=mins(t.de);
      if(k===0&&de<=m)continue;
      if(best===null||de<best.de)best={de,h:t.de};
    }
    if(best)return {k:'closed',t:`Cerrado según tu horario, abre ${k===0?'hoy':k===1?'mañana':'el '+DOW[day]} a las ${best.h}`};
  }
  return {k:'closed',t:'Cerrado según tu horario'};
}

/* ---------- colores de caducidad ---------- */
function cadClase(c){
  const d=daysLeft(c),s=state.settings;
  if(d===null)return '';
  if(d<0)return 'exp';
  if(d<=s.avisoDias)return 'bad';
  if(d<=s.naranjaDias)return 'warn';
  return 'ok';
}
function chipCad(c,sinFecha){
  const d=daysLeft(c);
  if(d===null)return sinFecha?'<span class="chip">Sin fecha</span>':'';
  const k=cadClase(c);
  let t;
  if(d<0)t=`Caducado hace ${-d} ${pl(-d,'día','días')}`;
  else if(d===0)t='Caduca hoy';
  else if(d<=60)t=`Caduca en ${d} ${pl(d,'día','días')}`;
  else t=`Caduca ${monthYear(c)}`;
  return `<span class="chip ${k}">${esc(t)}</span>`;
}
const liCls=c=>{const k=cadClase(c);return k?` class="c-${k}"`:'';};
const estadoTxt=d=>d<0?`caducó hace ${-d} ${pl(-d,'día','días')}`:d===0?'caduca hoy':`caduca en ${d} ${pl(d,'día','días')}`;

/* ---------- componentes de vista ---------- */
function gauge(name,days,note){
  const max=Math.max(4,Math.ceil(days)),step=max>8?2:1;
  let ticks='';
  for(let d=1;d<=max;d++){
    if(d===3||d%step===0){
      const left=(d/max*100).toFixed(2);
      ticks+=`<i class="tick${d===3?' t3':''}" style="left:${left}%"></i><span class="tl${d===3?' t3':''}" style="left:${left}%">${d===3?'72 h':d}</span>`;
    }
  }
  const cls=days<1?'bad':days<3?'warn':'';
  const w=Math.min(100,days/max*100).toFixed(1);
  return `<div class="gauge">
    <div class="g-head"><span class="g-name">${name}</span><span class="g-num">${nf(days,1)} <small>${pl(Number(nf(days,1).replace(',','.')),'día','días')}</small></span></div>
    <div class="ruler" role="img" aria-label="${name}: ${nf(days,1)} días de autonomía, objetivo 3 días"><span class="fill ${cls}" style="width:${w}%"></span>${ticks}</div>
    <p class="g-note">${note}</p></div>`;
}
const searchBox=(tab,n)=>n>=5?`<label class="fld search"><span class="sr">Buscar</span><input type="search" data-act="search" placeholder="Buscar por nombre" value="${esc(q[tab])}" autocomplete="off"></label>`:'';
const qtyHtml=(tab,it,m)=>`<div class="qty" role="group" aria-label="Cantidad que tienes de ${esc(it.nombre)}"><button data-act="qty" data-tab="${tab}" data-id="${esc(it.id)}" data-d="-1" aria-label="Quitar una unidad">−</button><span>${it.tengo||0}${m>0?'/'+m:''}</span><button data-act="qty" data-tab="${tab}" data-id="${esc(it.id)}" data-d="1" aria-label="Añadir una unidad">+</button></div>`;
const filtroHtml=tab=>`<div class="flt" role="group" aria-label="Filtro de la lista"><button data-act="filtro" data-tab="${tab}" data-v="todo" aria-pressed="${filtro[tab]==='todo'}">Todo</button><button data-act="filtro" data-tab="${tab}" data-v="comprar" aria-pressed="${filtro[tab]==='comprar'}">Por comprar</button></div>`;
function itemsCompra(tab){
  const arr=tab==='aparatos'?state.aparatos:state.higiene;
  return arr.map(it=>({it,falta:tab==='aparatos'?aFalta(it):hFalta(it)})).filter(x=>x.falta>0);
}
function textoCompra(tab){
  const c=itemsCompra(tab);if(!c.length)return '';
  let total=0;const L=[`Por comprar (${tab==='aparatos'?'aparatos':'higiene'})`];
  for(const {it,falta} of c){
    const sub=(it.precio||0)*falta;total+=sub;
    L.push(`- ${falta} × ${it.nombre}${it.precio>0?` (${eur(it.precio)} cada uno, ${eur(sub)})`:''}`);
  }
  if(total>0)L.push(`Total: ${eur(total)}`);
  return L.join('\n');
}
function compraHtml(tab){
  if(filtro[tab]!=='comprar')return '';
  const c=itemsCompra(tab);
  const total=c.reduce((t,x)=>t+(x.it.precio||0)*x.falta,0);
  return `<div class="buy"><p>${c.length?`Faltan ${c.length} ${pl(c.length,'línea','líneas')} por comprar${total>0?`, ${eur(total)} en total`:''}.`:'No falta nada por comprar.'}</p>${c.length?`<button class="btn" data-act="copiar" data-tab="${tab}">Copiar la lista</button>`:''}</div>`;
}
function revBanner(){
  if(!(state.comida.length+state.aparatos.length+state.higiene.length+state.medicinas.length))return '';
  const lim=state.settings.revisionDias,n=diasDesde(state.ultimaRevision||state.creado);
  if(n<lim)return '';
  const t=state.ultimaRevision?`Han pasado ${n} días desde la última revisión.`:`Llevas ${n} días con el kit sin revisarlo.`;
  return `<section class="rev" role="status"><h2>Toca revisar el kit</h2><p>${t} Prueba la radio y las linternas, recarga powerbanks y aparatos, mira las caducidades y rota la comida.</p><button class="btn" data-act="revHecha">Revisión hecha hoy</button></section>`;
}
function copiaBanner(){
  if(!(state.comida.length+state.aparatos.length+state.higiene.length+state.medicinas.length+state.sitios.length))return '';
  const lim=state.settings.copiaDias,n=diasDesde(state.ultimaCopia||state.creado);
  if(n<lim)return '';
  const t=state.ultimaCopia?`Hace ${n} días de tu última copia de seguridad.`:`Todavía no has hecho ninguna copia de seguridad, y llevas ${n} días con la app.`;
  return `<section class="rev copia" role="status"><h2>Haz una copia de seguridad</h2><p>${t} Tus datos viven solo en este móvil: si limpias los datos del navegador o cambias de teléfono, se pierden.</p><button class="btn" data-act="copiaAhora">Guardar copia ahora</button></section>`;
}
const avisos=()=>revBanner()+copiaBanner();
function autonomias(){
  const s=state.settings,c=calcComida(),pb=powerbanks(),it=[];
  if(c.kcal>0)it.push({n:'Comida',d:c.diasComida});
  if(c.litros>0)it.push({n:'Agua',d:c.diasAgua});
  const gas=state.aparatos.find(a=>a.tengo>0&&a.energia==='gas'&&a.minGas>0);
  if(gas)it.push({n:'Cocina',d:gas.minGas*(state.stock.gas||0)/(s.minCocinaDia||1)});
  if(pb.mah>0)it.push({n:'Móviles',d:pb.cargas/((npers()*s.cargasMovilDia)||1)});
  const hd=state.higiene.filter(h=>h.uso>0&&hNeed(h)>0).map(hDias);
  if(hd.length)it.push({n:'Higiene',d:Math.min(...hd)});
  return it;
}
function resumen(){
  const s=state.settings,it=autonomias();
  if(it.length<2)return '';
  const w=it.reduce((a,b)=>b.d<a.d?b:a);
  const dn=Number(nf(w.d,1).replace(',','.'));
  return `<section class="weak" aria-label="Lo primero que se acaba"><p class="w-line">Lo primero que se acaba: <strong>${w.n}, ${nf(w.d,1)} ${pl(dn,'día','días')}</strong></p>
    <div class="w-grid">${it.map(i=>`<div class="${i===w?'w-min':''}"><span>${i.n}</span><strong>${nf(i.d,1)}</strong></div>`).join('')}</div>
    <p class="hint">Valores en días. Cocina cuenta ${nf(s.minCocinaDia)} min al día y móviles ${nf(s.cargasMovilDia,1)} ${pl(s.cargasMovilDia,'carga','cargas')} por persona y día; los dos se cambian en Ajustes.</p></section>`;
}
function alertaHtml(src){
  const al=alertas(src);
  return al.length?`<section class="alert" role="status"><h2>Revisa estas caducidades</h2><ul>${
    al.map(({it,d})=>`<li><strong>${esc(it.nombre)}</strong>: ${estadoTxt(d)}</li>`).join('')}</ul></section>`:'';
}
const empty=t=>`<p class="empty">${t}</p>`;
const vacioBusq='<p class="empty">Nada coincide con la búsqueda.</p>';

/* ---------- listas ---------- */
function listComida(){
  const all=state.comida;
  const items=[...filtrar(all,'comida')].sort((a,b)=>{
    const da=daysLeft(a.caduca),db=daysLeft(b.caduca);
    if(da===null&&db===null)return a.nombre.localeCompare(b.nombre,'es');
    if(da===null)return 1;if(db===null)return -1;return da-db;});
  if(!all.length)return empty('Aún no has añadido nada. Pulsa Añadir comida y empieza por lo que ya tienes en casa: una línea por producto y fecha de caducidad.');
  if(!items.length)return vacioBusq;
  return `<ul class="list">${items.map(it=>{
    let det;
    if(it.tipo==='agua')det=it.litrosUd>0?`${nf(it.cantidad,2)} × ${nf(it.litrosUd,2)} L = ${nf(it.cantidad*it.litrosUd,1)} L`:'Sin litros por unidad';
    else det=it.kcalUd>0?`${nf(it.cantidad,2)} × ${nf(it.kcalUd)} kcal = ${nf(it.cantidad*it.kcalUd)} kcal`:'Sin kcal por unidad';
    return `<li${liCls(it.caduca)}><button class="row" data-act="edit" data-k="comida" data-id="${esc(it.id)}"><span class="r-main"><strong>${esc(it.nombre)}</strong><span class="r-sub">${det}</span></span>${chipCad(it.caduca,true)}</button></li>`;
  }).join('')}</ul>`;
}
function listAparatos(){
  const all=state.aparatos;
  let items=filtrar(all,'aparatos');
  if(filtro.aparatos==='comprar')items=items.filter(a=>aFalta(a)>0);
  if(!all.length)return empty('Aún no has añadido ningún aparato. Pulsa Añadir aparato y apunta la radio, las linternas, las powerbanks y lo demás.');
  if(!items.length)return filtro.aparatos==='comprar'&&!q.aparatos?empty('No falta nada por comprar.'):vacioBusq;
  return `<ul class="list">${items.map(a=>{
    const info=aparatoInfo(a),falta=aFalta(a);
    const fl=falta>0?`<span class="r-sub">Faltan ${falta}${a.precio>0?`, ${eur(a.precio*falta)}`:''}</span>`:'';
    return `<li><button class="row" data-act="edit" data-k="aparato" data-id="${esc(a.id)}"><span class="r-main"><strong>${esc(a.nombre)}</strong><span class="r-sub${info.pending?' pending':''}">${esc(info.t)}</span>${fl}</span></button>${qtyHtml('aparatos',a,a.cantidad)}</li>`;
  }).join('')}</ul>`;
}
function higInfo(it){
  const need=hNeed(it),t=hTengo(it),falta=hFalta(it),d=daysLeft(it.caduca);
  const l=[];
  if(d!==null&&d<0)l.push('Caducado: no cuenta.');
  if(it.uso>0)l.push(`Para 72 h: ${nf(need)}. Tienes ${nf(t)}, duran ${nf(hDias(it),1)} días.`);
  else if(need>0)l.push(`Objetivo ${nf(need)}, tienes ${nf(t)}.`);
  else l.push(`Tienes ${nf(t)}.`);
  return {l,falta};
}
function listHigiene(){
  const all=state.higiene;
  let items=filtrar(all,'higiene');
  if(filtro.higiene==='comprar')items=items.filter(it=>hFalta(it)>0);
  if(!all.length)return empty('Aún no has añadido nada. Ideas para empezar: bolsas grandes y gruesas, bolsas pequeñas, absorbente, toallitas, gel de manos, jabón, higiene femenina, cepillo y pasta.');
  if(!items.length)return filtro.higiene==='comprar'&&!q.higiene?empty('No falta nada por comprar.'):vacioBusq;
  return `<ul class="list">${items.map(it=>{
    const {l,falta}=higInfo(it);
    const fl=falta>0?`<span class="r-sub">Faltan ${nf(falta)}${it.precio>0?`, ${eur(it.precio*falta)}`:''}</span>`:'';
    return `<li${liCls(it.caduca)}><button class="row" data-act="edit" data-k="higiene" data-id="${esc(it.id)}"><span class="r-main"><strong>${esc(it.nombre)}</strong><span class="r-sub">${esc(l.join(' '))}</span>${fl}${it.caduca?`<span class="r-chip">${chipCad(it.caduca)}</span>`:''}</span></button>${qtyHtml('higiene',it,hNeed(it))}</li>`;
  }).join('')}</ul>`;
}
const PARA={adultos:'Adultos',ninos:'Niños',todos:'Todos'};
function listMedicinas(){
  const all=state.medicinas;
  const items=[...filtrar(all,'medicinas')].sort((a,b)=>{
    const da=daysLeft(a.caduca),db=daysLeft(b.caduca);
    if(da===null&&db===null)return a.nombre.localeCompare(b.nombre,'es');
    if(da===null)return 1;if(db===null)return -1;return da-db;});
  if(!all.length)return empty('Aún no has añadido nada. Ideas: ibuprofeno, paracetamol y lo que uses en casa para adultos y niños. Las dosis las pauta tu médico o farmacéutico: si quieres, apúntalas en la nota.');
  if(!items.length)return vacioBusq;
  return `<ul class="list">${items.map(it=>{
    const nota=it.nota?`<span class="r-sub">${esc(it.nota.length>70?it.nota.slice(0,70)+'…':it.nota)}</span>`:'';
    return `<li${liCls(it.caduca)}><button class="row" data-act="edit" data-k="medicina" data-id="${esc(it.id)}"><span class="r-main"><strong>${esc(it.nombre)}</strong><span class="r-sub">${PARA[it.para]||'Todos'}, ${nf(it.cantidad||0)} ${pl(it.cantidad,'unidad','unidades')}</span>${nota}</span>${chipCad(it.caduca,true)}</button></li>`;
  }).join('')}</ul>`;
}
function listSitios(){
  const all=state.sitios;
  const orden={open:0,closed:1,none:2};
  const items=filtrar(all,'sitios').map(s=>({s,e:estadoSitio(s)})).sort((a,b)=>orden[a.e.k]-orden[b.e.k]||a.s.nombre.localeCompare(b.s.nombre,'es'));
  if(!all.length)return empty('Aún no has añadido ningún sitio. Apunta la farmacia y el supermercado más cercanos, con teléfono, dirección y horario.');
  if(!items.length)return vacioBusq;
  return `<ul class="list">${items.map(({s,e})=>{
    const tel=String(s.tel||'').replace(/[^\d+]/g,'');
    const dias=s.revisado?diasDesde(s.revisado):null;
    const rev=s.revisado?`Horario revisado el ${esc(longDate(s.revisado))}${dias>180?'. Conviene volver a comprobarlo':''}.`:'';
    const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.dir||s.nombre);
    const chip=e.k==='open'?'<span class="chip ok">Abierto</span>':e.k==='closed'?'<span class="chip">Cerrado</span>':'<span class="chip">Sin horario</span>';
    return `<li class="site"><button class="row" data-act="edit" data-k="sitio" data-id="${esc(s.id)}"><span class="r-main"><strong>${esc(s.nombre)}</strong><span class="r-sub">${esc(s.tipo||'')}${s.dir?`, ${esc(s.dir)}`:''}</span>${e.k==='none'?'':`<span class="r-sub">${esc(e.t)}</span>`}${rev?`<span class="r-sub">${rev}</span>`:''}</span>${chip}</button>

  }).join('')}</ul>`;
}

function viewComida(){
  const c=calcComida();
  const noteK=c.kcal===0?'Añade comida para ver cuántos días cubres.'
    :c.faltaKcal>0?`Te faltan ${nf(c.faltaKcal)} kcal para 72 h.`:`Cubres 72 h con ${nf(-c.faltaKcal)} kcal de margen.`;
  const noteL=c.litros===0?'Añade agua para ver cuántos días cubres.'
    :c.faltaL>0?`Te faltan ${nf(c.faltaL,1)} L para 72 h.`:`Cubres 72 h con ${nf(-c.faltaL,1)} L de margen.`;
  let extra='';
  if(c.sinDato)extra+=`<li>${c.sinDato} ${pl(c.sinDato,'línea sin','líneas sin')} kcal o litros: no cuenta${c.sinDato>1?'n':''} en el cálculo.</li>`;
  if(c.caducados)extra+=`<li>${c.caducados} ${pl(c.caducados,'línea caducada','líneas caducadas')}: no cuenta${c.caducados>1?'n':''} en el cálculo.</li>`;
  return `${avisos()}${resumen()}<section aria-label="Autonomía">${gauge('Comida',c.diasComida,noteK)}${gauge('Agua',c.diasAgua,noteL)}
    ${extra?`<ul class="lines">${extra}</ul>`:''}</section>
    ${alertaHtml('comida')}
    <div class="sec-head"><h2>Lo que tienes</h2><button class="btn primary" data-act="add" data-k="comida">Añadir comida</button></div>
    ${searchBox('comida',state.comida.length)}
    <div id="listWrap">${listComida()}</div>`;
}

}
function viewAparatos(){

  const pb=powerbanks();

  lines.push(pb.mah>0?`Powerbanks: unas ${nf(pb.cargas,1)} cargas de móvil (${nf(pb.mah)} mAh útiles).`:'Powerbanks: ninguna comprada todavía.');

    ${filtroHtml('aparatos')}${compraHtml('aparatos')}

}

function aplicarApagon(){
  const on=!!state.apagon;
  document.documentElement.classList.toggle('apagon',on);
  const b=$('#btnApagon');if(b)b.setAttribute('aria-pressed',on?'true':'false');
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{
    if(!m.dataset.o)m.dataset.o=m.getAttribute('content');
    m.setAttribute('content',on?'#000000':m.dataset.o);
  });
}
function render(){
  try{
    aplicarApagon();
    const s=state.settings;
    $('#sub').textContent=`${s.adultos} ${pl(s.adultos,'adulto','adultos')} y ${s.ninos} ${pl(s.ninos,'niño','niños')}, ${nf(s.litrosDia,1)} L al día por persona`;
    $('#main').innerHTML=VIEWS[state.tab]();
    for(const t of TABS)$('#nav-'+t).setAttribute('aria-current',state.tab===t?'page':'false');
    for(const t of ['comida','higiene','medicinas']){
      const n=alertas(t).length,b=$('#badge-'+t);b.hidden=!n;b.textContent=n;
    }
  }catch(e){
    $('#main').innerHTML='<p class="empty">Algo ha fallado al mostrar los datos. Abre Ajustes y haz una copia antes de borrar nada.</p>';
    console.error(e);
  }
}

const dlg=$('#dlg');
function openDlg(html){dlg.innerHTML=`<div class="pad">${html}</div>`;if(!dlg.open)dlg.showModal();toggleGroups();}
function closeDlg(){if(dlg.open)dlg.close();}
function toggleGroups(){
  const f=dlg.querySelector('form');if(!f)return;
  const sel=f.elements.tipo?f.elements.tipo.value:(f.elements.energia?f.elements.energia.value:'');
  f.querySelectorAll('[data-show]').forEach(el=>{el.hidden=!el.dataset.show.split(' ').includes(sel);});
}
let toastT;
function toast(msg,label,fn){
  const t=$('#toast');t.textContent='';
  const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(label){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>{t.hidden=true;fn();});t.appendChild(b);}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},label?9000:3200);
}

function estadoAvisosBg(){

  const p=Notification.permission;
  const a=p==='granted'?'Notificaciones permitidas.':p==='denied'?'Notificaciones bloqueadas en el navegador.':'Notificaciones sin permitir todavía.';

/* ---------- copia, importación y calendario ---------- */
function backupJson(){return JSON.stringify({app:'kit72',v:2,exportado:new Date().toISOString(),data:state},null,1);}
function marcarCopia(){state.ultimaCopia=isoHoy();save();}
async function saveFile(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e&&e.name==='AbortError')return false;}
  }
  const url=URL.createObjectURL(file),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return true;
}
async function copyText(text,okMsg){
  try{if(!navigator.clipboard)throw 0;await navigator.clipboard.writeText(text);toast(okMsg);return true;}
  catch(e){
    openDlg(`<h2 id="dlgTitle">Copia el texto</h2><label class="fld">Selecciona y copia<textarea id="copyArea" spellcheck="false" style="min-height:160px">${esc(text)}</textarea></label><div class="actions"><span class="grow"></span><button type="button" class="btn primary" data-act="closeDlg">Cerrar</button></div>`);
    const ta=$('#copyArea');if(ta)ta.select();
    return false;
  }
}
function importData(text){
  let p;
  try{p=JSON.parse(text);}catch(e){toast('El texto no es una copia válida.');return;}
  const data=p&&p.app==='kit72'?p.data:null;
  if(!data||!Array.isArray(data.comida)||!Array.isArray(data.aparatos)){toast('El texto no es una copia de esta app.');return;}
  if(!confirm('Esto sustituye lo que tienes ahora por la copia. ¿Continuar?'))return;
  state=normalize(data,DEFAULTS());save();closeDlg();render();toast('Copia importada.');
}
const icsEsc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const fold=l=>{const out=[];while(l.length>60){out.push(l.slice(0,60));l=' '+l.slice(60);}out.push(l);return out.join('\r\n');};
function buildIcs(){
  const lim=Math.max(1,state.settings.avisoDias||14);
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kit72//ES','CALSCALE:GREGORIAN'];
  let n=0;
  for(const {it} of itemsConFecha()){
    const d=parseD(it.caduca);if(!d)continue;
    const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    L.push('BEGIN:VEVENT',`UID:${it.id}-${ymd(d)}@kit72`,`DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${ymd(d)}`,`DTEND;VALUE=DATE:${ymd(next)}`,
      `SUMMARY:${icsEsc('Caduca: '+it.nombre)}`,
      `DESCRIPTION:${icsEsc(`Kit de 72 horas: ${it.nombre}. Úsalo o repónlo.`)}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc('Caduca en '+lim+' '+pl(lim,'día','días')+': '+it.nombre)}`,
      `TRIGGER:-P${lim-1}DT15H`,'END:VALARM','END:VEVENT');
    n++;
  }
  L.push('END:VCALENDAR');
  return {text:L.map(fold).join('\r\n')+'\r\n',n};
}
function buildRevIcs(startIso){
  const d=parseD(startIso)||today();
  const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  const meses=Math.max(1,Math.round((state.settings.revisionDias||90)/30));
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const desc='Prueba la radio y las linternas. Recarga powerbanks y aparatos. Mira las caducidades y rota la comida. Revisa las medicinas.';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kit72//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:revision-${ymd(d)}@kit72`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ymd(d)}`,`DTEND;VALUE=DATE:${ymd(next)}`,
    `RRULE:FREQ=MONTHLY;INTERVAL=${meses}`,'SUMMARY:Revisar el kit de 72 h',`DESCRIPTION:${icsEsc(desc)}`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Revisar el kit de 72 h','TRIGGER:PT9H','END:VALARM','END:VEVENT','END:VCALENDAR'];
  return L.map(fold).join('\r\n')+'\r\n';
}
function calUrl(it){
  const lim=state.settings.avisoDias,d=parseD(it.caduca)||today();
  let aviso=new Date(d.getFullYear(),d.getMonth(),d.getDate()-lim);
  if(aviso<today())aviso=today();
  const fin=new Date(aviso.getFullYear(),aviso.getMonth(),aviso.getDate()+1);
  const text=`Caduca pronto: ${it.nombre}`;
  const det=`Caduca el ${longDate(it.caduca)}. Kit de 72 horas: úsalo o repónlo.`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${ymd(aviso)}/${ymd(fin)}&details=${encodeURIComponent(det)}`;
}

/* ---------- avisos en segundo plano (Android) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('kit72',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
let syncT;
function syncAlertas(){
  if(typeof indexedDB==='undefined')return;
  clearTimeout(syncT);
  syncT=setTimeout(async()=>{
    try{
      const prev=await idbGet('alertas').catch(()=>null);
      const items=itemsConFecha().filter(x=>x.it.caduca).map(x=>({n:x.it.nombre,f:x.it.caduca}));
      await idbSet('alertas',{items,lim:state.settings.avisoDias,ultimo:prev&&prev.ultimo?prev.ultimo:''});
    }catch(e){}
  },300);
}
async function activarAvisos(){
  if(typeof Notification==='undefined'||!('serviceWorker' in navigator)){toast('Este navegador no permite notificaciones.');return;}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Sin permiso para notificar. Actívalo en los ajustes del navegador.');refrescaEstado();return;}
  syncAlertas();
  const reg=await navigator.serviceWorker.ready;
  if(!('periodicSync' in reg)){toast('Notificaciones permitidas, pero este navegador no admite avisos en segundo plano. Usa el calendario.');refrescaEstado();return;}
  try{
    await reg.periodicSync.register('kit72-caducidad',{minInterval:12*3600*1000});
    state.avisosBg=true;save();
    toast('Avisos pedidos. Funcionan si el navegador lo permite: no están garantizados.');
  }catch(e){toast('El navegador no deja activarlos. Instala la app y ábrela como aplicación, o usa el calendario.');}
  refrescaEstado();
}
async function probarAviso(){
  if(typeof Notification==='undefined'||!('serviceWorker' in navigator)){toast('Este navegador no permite notificaciones.');return;}
  if(Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted'){toast('Sin permiso para notificar.');refrescaEstado();return;}}
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('Kit de 72 h',{body:'Así se verán los avisos de caducidad.',tag:'kit72-prueba',icon:'icon-192.png'});
  }catch(e){toast('No se pudo mostrar la notificación.');}
  refrescaEstado();
}
function refrescaEstado(){const e=$('#bgEstado');if(e)e.textContent=estadoAvisosBg();}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id,k=t.dataset.k;
  switch(act){
    case 'tab':state.tab=t.dataset.tab;save();render();window.scrollTo(0,0);break;
    case 'add':FORMS[k](null);break;
    case 'edit':FORMS[k](id);break;
    case 'del':{
      const f=dlg.querySelector('form');
      if(confirm('¿Eliminar esta línea?')){const arr=KINDS[k];state[arr]=state[arr].filter(x=>x.id!==f.dataset.id);save();closeDlg();render();}
      break;}
    case 'qty':{
      const it=state[t.dataset.tab].find(x=>x.id===id);
      if(it){it.tengo=Math.max(0,(it.tengo||0)+Number(t.dataset.d));save();render();}
      break;}
    case 'filtro':filtro[t.dataset.tab]=t.dataset.v;render();break;
    case 'copiar':{const txt=textoCompra(t.dataset.tab);if(txt)copyText(txt,'Lista copiada.');break;}
    case 'apagon':
      state.apagon=!state.apagon;save();render();
      toast(state.apagon?'Modo apagón activado. Baja también el brillo del móvil: es lo que más batería ahorra.':'Modo apagón desactivado.');
      break;
    case 'revHecha':state.ultimaRevision=isoHoy();save();if(dlg.open)closeDlg();render();toast('Revisión anotada.');break;
    case 'revIcs':saveFile('kit72-revisiones.ics',buildRevIcs(($('#revStart')||{}).value),'text/calendar');break;
    case 'settings':formAjustes();break;
    case 'closeDlg':closeDlg();break;
    case 'calc':{
      const kk=num($('#k100').value),g=num($('#gUd').value);
      if(kk>0&&g>0)dlg.querySelector('[name=kcalUd]').value=String(Math.round(kk*g/100));
      else toast('Rellena las kcal por 100 g y los gramos por unidad.');
      break;}
    case 'step':{
      const key=t.dataset.key;state.stock[key]=Math.max(0,(state.stock[key]||0)+Number(t.dataset.d));save();render();break;}
    case 'exportFile':saveFile('kit72-copia.json',backupJson(),'application/json').then(ok=>{if(ok){marcarCopia();render();}});break;
    case 'copiaAhora':saveFile('kit72-copia.json',backupJson(),'application/json').then(ok=>{if(ok){marcarCopia();render();toast('Copia guardada.');}});break;
    case 'exportText':{
      const txt=backupJson();
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{marcarCopia();toast('Copia copiada. Pégala en una nota o en un mensaje.');}).catch(()=>{
        const ta=$('#impText');ta.value=txt;ta.select();toast('Selecciona el texto del cuadro y cópialo.');});
      break;}
    case 'importText':importData($('#impText').value);break;
    case 'ics':{
      const r=buildIcs();
      if(!r.n){toast('No hay nada con fecha de caducidad.');break;}
      saveFile('kit72-caducidades.ics',r.text,'text/calendar');break;}
    case 'bgOn':activarAvisos();break;
    case 'bgTest':probarAviso();break;
    case 'wipe':
      if(confirm('Se borrará todo lo que has guardado. ¿Seguro?')&&confirm('Última comprobación: ¿borrar todos los datos?')){
        state=DEFAULTS();save();closeDlg();render();toast('Datos borrados.');}
      break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='stock'){
    state.stock[t.dataset.key]=Math.max(0,Math.floor(num(t.value)));save();render();
  }else if(t.name==='tipo'||t.name==='energia'){toggleGroups();}

dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg();});
dlg.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,fd=new FormData(f),id=f.dataset.id;
  const put=(arr,it)=>{const i=arr.findIndex(x=>x.id===it.id);if(i>=0)arr[i]=it;else arr.push(it);};
  let avisoCal=null;
  if(f.id==='fcomida'){
    const tipo=fd.get('tipo');
    const it={id:id||uid(),tipo,nombre:String(fd.get('nombre')).trim(),cantidad:num(fd.get('cantidad')),
      kcalUd:tipo==='comida'?numOrNull(fd.get('kcalUd')):null,
      litrosUd:tipo==='agua'?numOrNull(fd.get('litrosUd')):null,
      caduca:String(fd.get('caduca')||'')};
    const antes=id?state.comida.find(x=>x.id===id):null;
    put(state.comida,it);
    if(it.caduca&&(!antes||antes.caduca!==it.caduca))avisoCal=it;
  }else if(f.id==='faparato'){
    const en=fd.get('energia');
    const a={id:id||uid(),nombre:String(fd.get('nombre')).trim(),cantidad:Math.max(0,Math.round(num(fd.get('cantidad')))),
      tengo:Math.max(0,Math.round(num(fd.get('tengo')))),energia:en,precio:numOrNull(fd.get('precio'))};
    if(en==='pilas'){a.tipoPila=fd.get('tipoPila');a.pilasPorAparato=numOrNull(fd.get('pilasPorAparato'));a.horasJuego=numOrNull(fd.get('horasJuego'));}
    if(en==='bateria'){a.horasBateria=numOrNull(fd.get('horasBateria'));a.mah=numOrNull(fd.get('mahBat'));}
    if(en==='powerbank'){a.mah=numOrNull(fd.get('mahPb'));}
    if(en==='gas'){a.minGas=numOrNull(fd.get('minGas'));}
    put(state.aparatos,a);
  }else if(f.id==='fhigiene'){
    put(state.higiene,{id:id||uid(),nombre:String(fd.get('nombre')).trim(),tengo:Math.max(0,num(fd.get('tengo'))),
      uso:numOrNull(fd.get('uso')),objetivo:numOrNull(fd.get('objetivo')),precio:numOrNull(fd.get('precio')),
      caduca:String(fd.get('caduca')||'')});
  }else if(f.id==='fmedicina'){
    put(state.medicinas,{id:id||uid(),nombre:String(fd.get('nombre')).trim(),para:String(fd.get('para')||'todos'),
      cantidad:Math.max(0,Math.round(num(fd.get('cantidad')))),caduca:String(fd.get('caduca')||''),nota:String(fd.get('nota')||'').trim()});
  }else if(f.id==='fsitio'){
    const horario=[];
    for(let i=0;i<3;i++){
      const dias=fd.getAll('t'+i+'d').map(Number),de=fd.get('t'+i+'de'),a=fd.get('t'+i+'a');
      if(dias.length&&de&&a)horario.push({dias,de:String(de),a:String(a)});
    }
    const antes=id?state.sitios.find(x=>x.id===id):null;
    const cambia=!antes||JSON.stringify(antes.horario||[])!==JSON.stringify(horario);
    put(state.sitios,{id:id||uid(),nombre:String(fd.get('nombre')).trim(),tipo:String(fd.get('tipo')||''),
      tel:String(fd.get('tel')||'').trim(),dir:String(fd.get('dir')||'').trim(),horario,
      revisado:horario.length?(cambia?isoHoy():(antes&&antes.revisado)||isoHoy()):''});
  }else if(f.id==='fset'){
    const s=state.settings,n=(k,min,max)=>{const v=num(fd.get(k));return v>=min&&v<=max?v:s[k];};
    s.adultos=Math.round(n('adultos',0,20));s.ninos=Math.round(n('ninos',0,20));
    if(s.adultos+s.ninos<1)s.adultos=1;
    s.kcalAdulto=n('kcalAdulto',800,5000);s.kcalNino=n('kcalNino',500,4000);
    s.litrosDia=n('litrosDia',0.5,20);s.movilMah=n('movilMah',500,20000);s.eficiencia=n('eficiencia',10,100);
    s.avisoDias=Math.round(n('avisoDias',1,365));s.naranjaDias=Math.round(n('naranjaDias',1,730));
    if(s.naranjaDias<=s.avisoDias)s.naranjaDias=s.avisoDias+1;
    s.minCocinaDia=n('minCocinaDia',1,600);s.cargasMovilDia=n('cargasMovilDia',0.1,10);
    s.revisionDias=Math.round(n('revisionDias',7,730));s.copiaDias=Math.round(n('copiaDias',7,730));
    const u=String(fd.get('guardiaUrl')||'').trim();
    s.guardiaUrl=/^https?:\/\//i.test(u)?u:'';
    s.intro=fd.get('intro')==='on';
  }
  save();closeDlg();render();
  if(avisoCal)toast('Guardado.','Añadir al calendario',()=>{window.open(calUrl(avisoCal),'_blank','noopener');});
});

    q[state.tab]=t.value;
    const w=$('#listWrap');
    if(w)w.innerHTML=LISTS[state.tab]();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});

/* ---------- pantalla de bienvenida ---------- */
const CHISTES=[
  'Los zombis no saben leer fechas de caducidad. Tú sí.',
  'Regla número uno: cardio. Regla número dos: latas. Regla número tres: no abrir esa puerta.',
  'Si hay apocalipsis, que te pille con pilas AAA y sin prisas.',
  'Esto es un simulacro. Si fuera real, ya estarías bajando al súper a por más agua.',
  'No hace falta correr más que los zombis. Basta con tener más latas que el vecino.',
  'Aviso: ningún zombi ha sido herido en la elaboración de este inventario.',
  'Los supervivientes de las películas nunca tienen lista de la compra. Tú sí. Ventaja.',
  'Última comprobación antes del fin del mundo: ¿tienes abrelatas?'
];
function introEstado(){
  const it=autonomias();
  if(!it.length)return 'Despensa vacía: lo único que sobrevive es tu optimismo.';
  const w=it.reduce((a,b)=>b.d<a.d?b:a),dn=Number(nf(w.d,1).replace(',','.'));
  if(w.d>=3)return 'Nivel de pánico: bajo. Aguantas 72 h o más en todo lo que has apuntado. Los zombis, bastante menos.';
  if(w.d>=1)return `Nivel de pánico: medio. Lo primero que se te acaba es ${w.n.toLowerCase()}, en ${nf(w.d,1)} ${pl(dn,'día','días')}.`;
  return `Nivel de pánico: alto. ${w.n} te dura ${nf(w.d,1)} ${pl(dn,'día','días')}. Corre, pero al súper.`;
}
function setInert(on){['.top','#main','.nav'].forEach(s=>{const e=$(s);if(e)e.inert=on;});}
function mostrarIntro(){
  const el=$('#intro');if(!el)return;
  let visto=false;try{visto=sessionStorage.getItem('kit72.in')==='1';}catch(e){}
  if(!state.settings.intro||state.apagon||visto)return;
  $('#introLine').textContent=CHISTES[Math.floor(Math.random()*CHISTES.length)];
  $('#introStatus').textContent=introEstado();
  el.classList.remove('out');el.hidden=false;setInert(true);
  const b=$('#introBtn');if(b)b.focus();
}
function entrar(){
  const el=$('#intro');if(!el||el.hidden)return;
  el.classList.add('out');
  try{sessionStorage.setItem('kit72.in','1');}catch(e){}
  setInert(false);
  setTimeout(()=>{el.hidden=true;},400);
  const m=$('#main');if(m)m.focus();
}
if($('#intro')){
  $('#intro').addEventListener('click',entrar);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')entrar();});
}

/* ---------- arranque ---------- */
save();
render();
mostrarIntro();
if(!storageOk)toast('Este navegador no deja guardar datos. Haz copias desde Ajustes.');
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
window.__kit72={get state(){return state;},buildIcs,buildRevIcs,estadoSitio,textoCompra,calUrl,cadClase,normalize,DEFAULTS,introEstado,CHISTES};
})();
